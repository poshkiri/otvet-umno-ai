services:
  - type: web
    name: poymi-ai
    runtime: node
    region: frankfurt
    plan: starter
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_POLLING_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: OPENAI_IMAGE_EDIT_MODEL
        value: gpt-image-1
      - key: FREE_REQUEST_LIMIT
        value: "5"
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/bot.db
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: UNLIMITED_TELEGRAM_IDS
        value: "1264985917"
      - key: PLUS_SUBSCRIPTION_STARS
        value: "399"
      - key: PLUS_REQUEST_LIMIT
        value: "100"
      - key: PLUS_IMAGE_LIMIT
        value: "20"
      - key: PRO_IMAGE_LIMIT
        value: "2000"
      - key: GLOBAL_IMAGE_LIMIT
        value: "2000"
      - key: IMAGE_WINDOW_HOURS
        value: "720"
      - key: MAX_OUTPUT_TOKENS
        value: "1000"
      - key: MAX_VOICE_SECONDS
        value: "180"
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
      - key: REPORT_TIMEZONE
        value: Asia/Irkutsk
      - key: DAILY_REPORT_HOUR
        value: "10"
      - key: PLATEGA_MERCHANT_ID
        sync: false
      - key: PLATEGA_SECRET
        sync: false
      - key: PLATEGA_API_URL
        value: https://app.platega.io
      - key: PLATEGA_CHECKOUT_ENABLED
        value: "false"
